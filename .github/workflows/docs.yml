name: Docs site on GitHub Pages

# Builds the documentation site and publishes it to
# https://retrocorelabs.github.io/TSS/ - site only: no TSS build, no release.
# The pages are generated from the tracked files by docs-site/gen-site.sh;
# MkDocs is installed here only (docs-site/requirements.txt).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs-site/requirements.txt
      - run: ./docs-site/gen-site.sh
      - run: mkdocs build --strict -f build-site/mkdocs.yml -d "${{ runner.temp }}/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "${{ runner.temp }}/site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
