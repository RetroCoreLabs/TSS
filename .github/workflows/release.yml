name: release

# Build the TSS artifacts and attach the ready-to-boot disc set to a GitHub
# release. Runs on any tag like v1.0, v2026.07, ...
#
# The kit ships the ready-made CDC disc (dist/cdc-jumpstart.img.gz:
# bootstrap installed, MINIT-formatted, cold-started, user SYSTEM created),
# a blank drum, tss.cfg and run-tss.sh. No BPUN tapes are shipped. No
# emulator runs in CI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # allow a manual run to test the workflow

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TSS
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # ---- 1. the assembler, its tests, and the TSS artifacts ----------
      - name: Build mac and assemble TSS
        run: |
          make build
          make check-encoding

      - name: Score against the 1978 golden dump
        run: ./mac-c/scripts/verify/compare_asymb.sh Build/ASYMB.SYMB reference/ASYMB.SYMB

      # ---- 2. package the disc set ------------------------------------
      # cdc.img = the ready-made jump-start disc; drum.img = a blank 1 MB drum.
      - name: Assemble the release archive
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          OUT="nord-tss-3.0-$VER"
          mkdir -p "$OUT"
          gunzip -c dist/cdc-jumpstart.img.gz > "$OUT/cdc.img"
          head -c 1048576 /dev/zero      > "$OUT/drum.img"
          cp dist/tss.cfg dist/run-tss.sh  "$OUT/"
          cp dist/QUICKSTART.md            "$OUT/README.md"
          chmod +x "$OUT/run-tss.sh"
          tar czf "$OUT.tar.gz" "$OUT"
          sha256sum "$OUT.tar.gz" > "$OUT.tar.gz.sha256"
          echo "ARCHIVE=$OUT.tar.gz" >> "$GITHUB_ENV"

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tss-disc-set
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          body: |
            NORD TSS 3.0, built from the 1973 sources by this repository's
            own MAC assembler: a ready-to-boot CDC disc with user SYSTEM
            created, and a blank swapping drum.

            Unpack, then:

                ./run-tss.sh /path/to/nd100x

            Log in as **SYSTEM**, project **1**, no password.

            Needs nd100x from https://github.com/HackerCorpLabs/nd100x
