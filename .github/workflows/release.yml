name: release

# Build the TSS artifacts and attach the bring-up kit to a GitHub release.
# Runs on any tag like v1.0, v2026.07, ...
#
# The kit ships the BUILT SYSTEM AND BLANK MEDIA - the user performs the
# same three bring-up steps a 1973 operator did (bootstrap tape, MINIT
# format, cold start), following the QUICKSTART inside the archive. No
# emulator runs in CI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # allow a manual run to test the workflow

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TSS
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # ---- 1. the assembler, its tests, and the TSS artifacts ----------
      - name: Build mac and assemble TSS
        run: |
          make build
          make check-encoding

      - name: Score against the 1978 golden dump
        run: ./mac-c/scripts/verify/compare_asymb.sh Build/ASYMB.SYMB reference/ASYMB.SYMB

      # ---- 2. package the bring-up kit ----------------------------------
      # cdc.img = the built overlay disc padded to 8192 sectors (the CDC
      # device does not grow on writes); drum.img = a blank 1 MB drum.
      # Padding appends zeros only, so the overlays are untouched.
      - name: Assemble the release archive
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          OUT="nord-tss-3.0-$VER"
          mkdir -p "$OUT"
          cp Build/drum/tss-drum.bpun      "$OUT/tss.bpun"
          cp Build/minit/minit.bpun        "$OUT/minit.bpun"
          cp Build/tdump/cdbin-boot.bpun   "$OUT/cdbin-boot.bpun"
          cp Build/drum/tss-cdc.img        "$OUT/cdc.img"
          truncate -s 4M                   "$OUT/cdc.img"
          gunzip -c dist/cdc-jumpstart.img.gz > "$OUT/cdc-jumpstart.img"
          head -c 1048576 /dev/zero      > "$OUT/drum.img"
          cp dist/tss.cfg dist/run-tss.sh  "$OUT/"
          cp dist/QUICKSTART.md            "$OUT/README.md"
          chmod +x "$OUT/run-tss.sh"
          tar czf "$OUT.tar.gz" "$OUT"
          sha256sum "$OUT.tar.gz" > "$OUT.tar.gz.sha256"
          echo "ARCHIVE=$OUT.tar.gz" >> "$GITHUB_ENV"

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tss-disc-set
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          body: |
            NORD TSS 3.0, built from the 1973 sources by this repository's
            own MAC assembler: the system tape, the MINIT format tape, the
            CDBIN bootstrap-install tape, and the disc media.

            Unpack, then either jump start with the ready-made
            cdc-jumpstart.img, or follow the bring-up in the archive's
            README (bootstrap tape -> MINIT format -> cold start, about
            two minutes, once). After that:

                ./run-tss.sh /path/to/nd100x

            Log in as **SYSTEM**, project **1**, no password.

            Needs nd100x from https://github.com/HackerCorpLabs/nd100x
