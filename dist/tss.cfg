# ---------------------------------------------------------------------------
# NORD TSS 3.0 on nd100x - ready-to-run configuration
#
#   nd100x --config=tss.cfg
#
# MMS 1 is REQUIRED - set below with `mms = 1`. Without it the machine boots
# and then hangs in the overlay loader. nd100x reads the [machine] mms key
# from 1.0.15 on; for an older build pass --mms=1 on the command line (the
# run script run-tss.sh does that too).
#
# Log in at the @ENTER prompt as SYSTEM, project 1, no password.
# The date prompt wants DD,MM,YYYY,HH,MM,SS  e.g.  26,07,2026,08,30,00
# ---------------------------------------------------------------------------

[machine]
# One clock interrupt every 20 ms of real time, so DATE keeps real time.
rtc      = wall

# NORD TSS 3.0 is 1973 NORD-10 code: it programs the MMU the
# Paging-System-I way - single 16-bit page-table words (0163000 |
# physical_page) written to 0177400, then PON (IPGTB, src/TSS1.SYMB). MMS2,
# the nd100x default, mis-decodes those PCR values, so user virtual page 0
# never maps to the resident vector page. --mms=1 on the command line does
# the same and wins over this key.
mms      = 1

[boot]
# Boot from the CDC cartridge disc (the LOAD button: sector 0 into core 0,
# start at 0). The disc must carry boot sectors - cdc-jumpstart.img does, and
# so does a disc that has been through the bring-up in the README.
device   = cdc

[runtime]
# The CDC cartridge disc. Ships unformatted - do the one-time bring-up in
# the README first (bootstrap tape, MINIT format, cold start). Keep a copy
# afterwards if you want a fresh-system restore point - the running system
# writes to it.
cdc      = cdc.img

# The NORD-10 swapping drum at IOX 540, populated by the running system.
drum     = drum.img

# Uncomment to attach a DAP debugger (VS Code, or the project probe scripts).
# debugger = on
# port     = 1777
