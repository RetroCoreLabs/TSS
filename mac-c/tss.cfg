# TSS-on-nd100x test setup.  (Kept here in mac-c/ because Build/drum/ is wiped
# by build_tss_drum.sh.)
#   run:  nd100x --config=/mnt/e/Dev/Ronny/TSS/mac-c/tss.cfg
# Any command-line flag overrides a value set here.

boot     = bpun
image    = /mnt/e/Dev/Ronny/TSS/Build/drum/tss-drum.bpun

# No `start=` needed: the BPUN itself carries the autostart address
# (ISTRT=025076), emitted by `mac-as -e ISTRT`, and nd100x reads it as the boot
# address. (An explicit `start=` would still override it if ever required.)

# NORD TSS swapping drum @ IOX 540. Kept in Build/ (not Build/drum/, which the
# build wipes). Created empty at 8 MiB if absent; the running TSS populates it.
drum     = /mnt/e/Dev/Ronny/TSS/Build/drum.img

# NORD TSS 3.0 is 1973 NORD-10 code: it programs the MMU the Paging-System-I (MMS1) way —
# single 16-bit page-table words (0163000 | physical_page) written to 0177400, then PON
# (src/TSS1.SYMB IPGTB). MMS2 (the default) would mis-decode those PCR values (bit 2 / 16-PT
# field), so user virtual page 0 fails to map to the resident vector page and GOVER loops.
mms      = 1

# DAP debugger on the TSS project port (not the default 4711).
debugger = on
port     = 1777
